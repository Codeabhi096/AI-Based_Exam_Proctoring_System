<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyProctor.ai</title>

  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="//use.fontawesome.com/releases/v5.0.7/css/all.css">
  <link type="text/css" rel="stylesheet" href="{{ url_for('static', filename='vendor/@fortawesome/fontawesome-free/css/all.min.css') }}">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

  <!-- Favicon -->
  <link rel="apple-touch-icon" sizes="120x120" href="{{ url_for('static', filename='assets/img/favicon/apple-touch-icon.png') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='assets/img/favicon/favicon-32x32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='assets/img/favicon/favicon-16x16.png') }}">
  <link rel="manifest" href="{{ url_for('static', filename='assets/img/favicon/site.webmanifest') }}">

  <!-- Pixel CSS -->
  <link type="text/css" rel="stylesheet" href="{{ url_for('static', filename='css/pixel.css') }}">

  <!-- jQuery -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

  {% block head %}{% endblock %}

  <style>
    /* ══ GLOBAL RESET & BASE ══ */
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --navy:      #060d1f;
      --navy2:     #0b1730;
      --blue:      #2563eb;
      --blue-l:    #3b7fff;
      --cyan:      #06c2d4;
      --white:     #ffffff;
      --off-white: #f0f5ff;
      --text:      #0f172a;
      --muted:     #64748b;
      --border:    #e2e8f0;
      --nav-h:     66px;
      --footer-bg: #060d1f;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--off-white);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      padding-top: 0 !important;
      margin-top: 0 !important;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Kill any gap after navbar */
    .header-global + *,
    header + *,
    nav + * { margin-top: 0 !important; padding-top: 0 !important; }
    .navbar { margin-bottom: 0 !important; }
    .messages-wrap:empty { display: none !important; }

    h1, h2, h3, h4, h5, h6 {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* ══ FLASH MESSAGES ══ */
    .alert {
      border-radius: 10px;
      border: none;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .alert-success { background: #dcfce7; color: #166534; }
    .alert-danger  { background: #fee2e2; color: #991b1b; }
    .alert-warning { background: #fef3c7; color: #92400e; }
    .alert-info    { background: #dbeafe; color: #1e40af; }

    /* ══ FOOTER ══ */
    footer#sticky-footer {
      background: var(--footer-bg);
      border-top: 1px solid rgba(255,255,255,0.06);
      padding: 28px 0 20px !important;
      margin-top: auto;
      position: relative;
      overflow: hidden;
    }

    footer#sticky-footer::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(37,99,235,0.1) 0%, transparent 65%);
      pointer-events: none;
    }

    .footer-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .footer-brand-name {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 1.05rem;
      color: #fff;
      letter-spacing: -0.2px;
    }

    .footer-brand-name span {
      background: linear-gradient(90deg, #7eb3ff, #06c2d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 20px;
      margin-bottom: 14px;
    }

    .footer-links a {
      color: rgba(255,255,255,0.42);
      font-size: 0.8rem;
      font-weight: 500;
      text-decoration: none;
      transition: color 0.18s;
    }
    .footer-links a:hover { color: rgba(255,255,255,0.85); }

    .footer-divider {
      width: 40px; height: 1px;
      background: rgba(255,255,255,0.08);
      margin: 14px auto;
    }

    .footer-copy {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.3);
      text-align: center;
      margin: 0;
      line-height: 1.6;
    }

    .footer-copy a {
      color: rgba(255,255,255,0.45);
      text-decoration: none;
      transition: color 0.18s;
    }
    .footer-copy a:hover { color: #7eb3ff; }

    .footer-heart {
      display: inline-block;
      color: #f87171;
      animation: heartbeat 1.5s ease-in-out infinite;
    }
    @keyframes heartbeat {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.25); }
    }

    /* ══ SCROLLBAR ══ */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--navy); }
    ::-webkit-scrollbar-thumb { background: rgba(59,127,255,0.4); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(59,127,255,0.7); }

    /* ══ SELECTION ══ */
    ::selection { background: rgba(37,99,235,0.25); color: var(--navy2); }

    /* ══ SMOOTH PAGE LOAD ══ */
    body { animation: pageFadeIn 0.35s ease; }
    @keyframes pageFadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>

<body>

  <!-- Navbar -->
  {% include 'includes/_navbar.html' %}

  <!-- Flash Messages -->
  <div class="messages-wrap" style="position:fixed;top:74px;left:50%;transform:translateX(-50%);z-index:1040;width:100%;max-width:600px;padding:0 16px;">
    {% include 'includes/_messages.html' %}
  </div>

  <!-- Page Content -->
  {% block body %}{% endblock %}

  <!-- ══ FOOTER ══ -->
  <footer id="sticky-footer">
    <div class="container" style="position:relative;z-index:2;">

      <div class="footer-brand">
        <div class="footer-brand-name">MyProctor<span>.ai</span></div>
      </div>

      <div class="footer-links">
        <a href="/">Home</a>
        <a href="/login">Login</a>
        <a href="/register">Register</a>
        <a href="/contact">Contact</a>
        <a href="/faq">FAQ</a>
      </div>

      <div class="footer-divider"></div>

      <p class="footer-copy">
        Copyright &copy; MyProctor.ai <script>document.write(new Date().getFullYear())</script>. All rights reserved.
        <br>
        Made with <span class="footer-heart">♥</span> by
        <a href="https://mrabhi-7208.netlify.app/" target="_blank" rel="noopener">Abhishek Pathak</a>
      </p>

    </div>
  </footer>

  <!-- ══ SCRIPTS ══ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
  <script src="{{ url_for('static', filename='vendor/popper.js/dist/umd/popper.min.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/bootstrap/dist/js/bootstrap.min.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/headroom.js/dist/headroom.min.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/onscreen/dist/on-screen.umd.min.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/nouislider/distribute/nouislider.min.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/bootstrap-datepicker/dist/js/bootstrap-datepicker.min.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/waypoints/lib/jquery.waypoints.min.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/jarallax/dist/jarallax.min.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/jquery.counterup/jquery.counterup.min.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/jquery-countdown/dist/jquery.countdown.min.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/smooth-scroll/dist/smooth-scroll.polyfills.min.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/prismjs/prism.js') }}"></script>
  <script src="{{ url_for('static', filename='assets/js/pixel.js') }}"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
  <script async defer src="https://buttons.github.io/buttons.js"></script>

</body>
</html>
